[project]
name = "weibo-collector-console"
version = "0.1.0"
description = "Weibo collection and single-user administration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Scrapy==2.17.0",
    "requests>=2.31,<3",
    "Pillow>=8.1.1",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
